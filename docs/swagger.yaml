info:
  contact: {}
  license:
    name: Apache 2.0
paths:
  /api/v1/base/button:
    post:
      description: 创建按钮和按钮关联的RestfulApi(不会创建子按钮)
      parameters:
      - description: 创建按钮参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schema.ButtonPre'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.IDResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginx.OperateResult'
      summary: 创建按钮
      tags:
      - Button
    put:
      description: 批量更新按钮基础信息
      parameters:
      - description: 更新按钮基础信息参数
        in: body
        name: body
        required: true
        schema:
          items:
            $ref: '#/definitions/schema.Button'
          type: array
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginx.OperateResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginx.OperateResult'
      summary: 批量更新按钮基础信息
      tags:
      - Button
  /api/v1/base/button/:id:
    delete:
      description: 删除按钮和按钮调用的Api
      parameters:
      - description: 按钮ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginx.OperateResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginx.OperateResult'
      summary: 删除按钮
      tags:
      - Button
    put:
      description: 更新按钮基础信息、按钮关联的Restful接口信息、指定Restful接口基础信息
      parameters:
      - description: 按钮ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新按钮信息参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schema.ButtonPre'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginx.OperateResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginx.OperateResult'
      summary: 更新按钮信息
      tags:
      - Button
  /api/v1/base/disabled_field/:id:
    delete:
      description: 删除禁用字段
      parameters:
      - description: 字段ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ginx.OperateResult'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ginx.OperateResult'
      summary: 删除禁用字段
      tags:
      - DisabledField
  /api/v1/base/menu:
    put:
      description: 菜单、按钮及可禁用字段的基础信息(创建、更新)。菜单和按钮调用的api(创建、更新、删除)
      parameters:
      - description: 更新菜单树参数
        in: body
        name: body
        required: true
